[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tat-guard"
version = "0.1.0"
description = "UPI TAT reconciliation and penalty tracking on Exasol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Harshit Aryan", email = "harshitaryan21@gmail.com"},
]
# Declared in setup.py; without this setuptools drops them from the built package.
dynamic = ["dependencies", "optional-dependencies", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
