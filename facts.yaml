  # RBI quotes below were extracted verbatim from the raw page fetched 2026-10-08 with curl
  # (sha256 11edc1fc33cdfefca693677ac0aff8c42aff60ed1fd3b769964fcfd948d61af1, saved to refs/RBI-TAT.html, not redistributed).
  - id: RBI-TAT-REF
    claim: "RBI/2019-20/67, DPSS.CO.PD No.629/02.01.014/2019-20, dated 20 Sep 2019, effective 15 Oct 2019"
    quote: "This directive is issued under Section 10(2) read with Section 18 of the Payment and Settlement Systems Act, 2007 (Act 51 of 2007) and shall come into effect from October 15, 2019."
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-UPI-P2P
    claim: "UPI fund transfer, beneficiary not credited: auto-reversal within T+1"
    quote: "Account debited but the beneficiary account is not credited (transfer of funds). If unable to credit the beneficiary account, auto reversal (R) by the Beneficiary bank latest on T + 1 day. ₹100/- per day if delay is beyond T + 1 day."
    value: 1
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-UPI-P2M
    claim: "UPI merchant payment, confirmation not received: auto-reversal within T+5"
    quote: "Account debited but transaction confirmation not received at merchant location (payment to merchant). Auto-reversal within T + 5 days. ₹100/- per day if delay is beyond T + 5 days."
    value: 5
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-IMPS
    claim: "IMPS: auto-reversal by beneficiary bank latest on T+1"
    quote: "Account debited but the beneficiary account is not credited. If unable to credit to beneficiary account, auto reversal (R) by the Beneficiary bank latest on T + 1 day. ₹100/- per day if delay is beyond T + 1 day."
    value: 1
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-COMP
    claim: "Compensation Rs 100 per day of delay beyond TAT"
    quote: "₹100/- per day if delay is beyond T + 1 day."
    value: 100
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-SUOMOTO
    claim: "Financial compensation shall be effected suo moto, without waiting for complaint"
    quote: "Wherever financial compensation is involved, the same shall be effected to the customer’s account suo moto, without waiting for a complaint or claim from the customer."
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-DAYCOUNT
    claim: "T is the transaction day as a calendar date; TAT days are calendar days"
    quote: "T is the day of transaction and refers to the calendar date."
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
    note: "resolved 2026-10-08 (was VERIFY)"
  - id: RBI-TAT-R-DEF
    claim: "R (reversal day) = day the reversal is concluded and funds reach the issuer/originator"
    quote: "R is the day on which the reversal is concluded and the funds are received by the issuer / originator."
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693
    status: verified
  - id: RBI-TAT-STILL-IN-FORCE
    claim: "Circular not superseded as of submission date"
    status: VERIFY
    evidence: >
      Checked 2026-10-08. (1) The circular page shows no repeal or withdrawal notice. (2) The rbi.org.in
      Master Directions list for "Payment and Settlement System" (did=344) has no direction on TAT for
      failed transactions. (3) RBI consolidated about 9,000 circulars into Master Directions in Nov 2025
      (secondary: https://www.newsonair.gov.in/rbi-repeals-9000-circulars-consolidates-rules-into-244-master-directions-to-ease-compliance/).
      The repeal annexes were NOT checked for DPSS.CO.PD No.629. Status stays VERIFY until they are.

